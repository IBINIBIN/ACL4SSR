name: Sync Fork

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: sync-fork
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/ACL4SSR/ACL4SSR.git

      - name: Fetch upstream
        run: |
          git fetch upstream master

      - name: Merge upstream
        run: |
          git merge upstream/master --no-edit || true

      - name: Keep local workflows
        run: |
          git restore --source=HEAD --staged --worktree .github/workflows || true

      - name: Commit
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi

          git commit -m "chore: sync ACL4SSR upstream"

      - name: Push
        run: |
          git push origin master
